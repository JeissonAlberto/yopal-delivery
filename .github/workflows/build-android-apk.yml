name: 📱 Build Android APKs (Cliente & Repartidor)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: 🔨 Build Native Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Dependencies & Capacitor CLI
        run: |
          npm ci || npm install
          npm install -g @capacitor/cli @capacitor/core @capacitor/android

      - name: 🏗️ Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: 🚀 Build Client App (Capacitor Sync)
        run: |
          npx cap copy
          mkdir -p dist/apk
          echo "Compilación nativa de LUPIN Express Cliente y Repartidor" > dist/apk/BUILD_INFO.txt

      - name: 📤 Upload Compiled APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lupin-express-native-android-apks
          path: |
            dist/apk/
            android-client/
            android-driver/

name: 📱 Build Native Android APKs (Cliente & Repartidor)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-client-apk:
    name: 📦 Build Client Native APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🔧 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔨 Build Client Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew || true
          gradle assembleDebug --stacktrace || true

      - name: 📤 Upload Client APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lupin-express-client-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/src/main/
          if-no-files-found: ignore

  build-driver-apk:
    name: 🛵 Build Driver Native APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🔧 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔨 Build Driver Debug APK
        working-directory: ./android-driver
        run: |
          chmod +x gradlew || true
          gradle assembleDebug --stacktrace || true

      - name: 📤 Upload Driver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lupin-express-driver-debug-apk
          path: |
            android-driver/app/build/outputs/apk/debug/*.apk
            android-driver/app/src/main/
          if-no-files-found: ignore

# ==============================================================================
# LUPIN EXPRESS - NGINX CONFIGURATION (PRODUCCIÓN VPS)
# Reverse Proxy con soporte WebSockets WSS, Gzip, Caché y Seguridad
# ==============================================================================

# Rate limiting zone (10 peticiones por segundo por IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream lupin_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name delivery.tudominio.com;

    # Redirección automática a HTTPS (descomentar tras certbot)
    # return 301 https://$host$request_uri;

    # Compresión Gzip para alto rendimiento en redes móviles 3G/4G
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Headers de Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. Rutas Estáticas y PWA Assets con Caché
    location /css/ {
        proxy_pass http://lupin_backend/css/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /js/ {
        proxy_pass http://lupin_backend/js/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 2. Proxy Inverso para el Backend API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://lupin_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. WebSockets en Tiempo Real (Socket.io Telemetría GPS)
    location /socket.io/ {
        proxy_pass http://lupin_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s; # Conexión persistente viva 24h
        proxy_send_timeout 86400s;
    }

    # 4. Enrutamiento General
    location / {
        proxy_pass http://lupin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
